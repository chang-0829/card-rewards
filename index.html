<!DOCTYPE html>
<html lang="zh-TW">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <title>信用卡哩程回饋財報中心 V15</title>
   <!-- React & ReactDOM -->
   <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
   <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
   <!-- Babel -->
   <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
   <!-- Tailwind CSS -->
   <script src="https://cdn.tailwindcss.com"></script>
   <!-- SheetJS for Excel/CSV parsing -->
   <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
   <!-- Font Awesome -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

   <style>
       @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
       
       body, html {
           background-color: #F8FAFC;
           font-family: 'Inter', 'Noto Sans TC', -apple-system, sans-serif;
           -webkit-font-smoothing: antialiased;
           color: #1e293b;
           overflow: hidden;
           position: fixed;
           inset: 0;
           width: 100%;
       }
       
       .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
       .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
       .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
       
       input[type="file"]::file-selector-button { display: none; }
       .table-row-hover:hover { background-color: #f8fafc; }
       input[type=number]::-webkit-inner-spin-button,
       input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
       
       @keyframes modalFadeIn {
           from { opacity: 0; transform: translateY(10px) scale(0.98); }
           to { opacity: 1; transform: translateY(0) scale(1); }
       }
   </style>
</head>
<body>
   <div id="root" className="w-full h-full"></div>

   <script type="text/babel">
       const { useState, useEffect, useMemo, useRef } = React;

       // 全域安全 ID 產生器
       function generateId() {
           if (typeof crypto !== 'undefined' && crypto.randomUUID) {
               return crypto.randomUUID();
           }
           return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2);
       }

       // 資料庫遷移助手
       function parseLegacyKeywords(data, defaultArray = []) {
           if (Array.isArray(data)) return data.map(r => ({ ...r, location: r.location || 'ALL', id: r.id || generateId() }));
           if (typeof data === 'string') {
               return data.split(',').map(s => s.trim()).filter(Boolean).map(keyword => ({
                   id: generateId(), keyword, location: 'ALL', startDate: '', endDate: '', note: ''
               }));
           }
           return defaultArray;
       }

       const DEFAULT_SETTINGS = {
           billingDay: 5,
           evaCards: "8888, 7777",
           amCards: "9999, 6666, 7738, 4086",
           evaBonusRules: parseLegacyKeywords("長榮航空, 旅行社, 機票, 國外自由行"),
           amBonusRules: parseLegacyKeywords("餐廳, 飯店, 遊樂園, 交通, 綠界, 藍新, 酷澎"),
           evaExcludeRules: parseLegacyKeywords("手續費, 繳費, 稅, 全聯, 便利商店, 超商"),
           amExcludeRules: parseLegacyKeywords("手續費, 繳費, 稅, 全聯, 便利商店, 超商"),
           evaBaseRules: [],
           amBaseRules: [],  
           evaOverseasPhysical: [],
           evaOverseasOnline: [],  
           evaBaseRate: 22,
           evaOverseasRate: 15,
           evaBonusRate: 10,
           amBaseRate: 25,
           amBonusRate: 10,
           amMonthlyCap: 100000
       };

       // --- 核心子組件抽離 ---
       function StatBlock({ label, value, subtext, highlightClass }) {
           return (
               <div className="flex flex-col items-end shrink-0">
                   <span className="text-[11px] font-medium text-slate-500 mb-0.5">{label}</span>
                   <span className={`text-xl font-bold tracking-tight ${highlightClass || 'text-slate-800'}`}>{value}</span>
                   {subtext && <span className="text-[10px] text-slate-400 mt-0.5 font-medium">{subtext}</span>}
               </div>
           );
       }

       // V15：強化的 React State Tooltip，完美支援手機點擊與關閉
       function InfoTooltip({ rule, theme }) {
           const [isOpen, setIsOpen] = useState(false);
           const tooltipRef = useRef(null);

           useEffect(() => {
               const handleClickOutside = (e) => {
                   if (tooltipRef.current && !tooltipRef.current.contains(e.target)) {
                       setIsOpen(false);
                   }
               };
               document.addEventListener('mousedown', handleClickOutside);
               document.addEventListener('touchstart', handleClickOutside);
               return () => {
                   document.removeEventListener('mousedown', handleClickOutside);
                   document.removeEventListener('touchstart', handleClickOutside);
               };
           }, []);

           if (!rule) return null;
           const iconColor = theme === 'rose' ? 'text-rose-500' : theme === 'emerald' ? 'text-emerald-500' : theme === 'teal' ? 'text-teal-500' : 'text-blue-500';
           const titleText = theme === 'rose' ? '觸發排除規則' : theme === 'blue' ? '強制一般消費' : '觸發加碼規則';
           const titleIcon = theme === 'rose' ? 'fa-ban' : theme === 'blue' ? 'fa-check' : 'fa-star';
           
           return (
               <div ref={tooltipRef} className="relative flex items-center ml-1 z-10 cursor-pointer"
                    onMouseEnter={() => setIsOpen(true)}
                    onMouseLeave={() => setIsOpen(false)}
                    onClick={(e) => { e.stopPropagation(); setIsOpen(!isOpen); }}>
                   
                   <div className={`p-0.5 ${iconColor}`}><i className="fa-solid fa-circle-info"></i></div>
                   
                   {isOpen && (
                       <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-56 p-3 bg-slate-800 text-white text-[12px] rounded-xl shadow-2xl border border-slate-700 font-normal text-left z-50">
                           <div className="font-bold mb-2 border-b border-slate-600 pb-1.5 flex items-center gap-1.5">
                               <i className={`fa-solid ${titleIcon} ${iconColor}`}></i> <span>{titleText}</span>
                           </div>
                           <div className="grid grid-cols-[45px_1fr] gap-1.5 text-slate-300">
                               <span>關鍵字</span><span className="font-bold text-white">{rule.keyword}</span>
                               {rule.startDate && <><span>開始</span><span className="text-white">{rule.startDate.replace(/-/g, '/')}</span></>}
                               {rule.endDate && <><span>結束</span><span className="text-white">{rule.endDate.replace(/-/g, '/')}</span></>}
                           </div>
                           {rule.note && <div className="mt-2 text-slate-300 italic text-[11px] bg-slate-700/50 p-1.5 rounded">{rule.note}</div>}
                           <div className="absolute top-full left-1/2 transform -translate-x-1/2 border-4 border-transparent border-t-slate-800"></div>
                       </div>
                   )}
               </div>
           );
       }

       // V15：全新手機適應橫向表格
       function RuleTableComp({ rules, onChange, title, typeColor, iconClass }) {
           const add = () => onChange([...rules, { id: generateId(), keyword: '', location: 'ALL', startDate: '', endDate: '', note: '' }]);
           const up = (id, f, v) => onChange(rules.map(r => r.id === id ? { ...r, [f]: v } : r));
           const del = (id) => onChange(rules.filter(r => r.id !== id));
           const color = typeColor === 'emerald' ? 'text-emerald-700' : typeColor === 'teal' ? 'text-teal-700' : typeColor === 'blue' ? 'text-blue-700' : 'text-rose-700';

           return (
               <div className="mb-8">
                   <div className={`text-[15px] font-bold mb-3 flex justify-between items-center ${color}`}>
                       <span className="flex items-center gap-2"><i className={iconClass}></i> {title}</span>
                       <button onClick={add} className="text-[12px] bg-white border border-slate-200 shadow-sm px-3 py-1.5 rounded-lg hover:bg-slate-50 text-slate-700 flex items-center gap-1.5 transition-colors">
                           <i className="fa-solid fa-plus"></i> 新增
                       </button>
                   </div>
                   <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                       <div className="overflow-x-auto custom-scrollbar">
                           <table className="w-full text-left min-w-[700px] border-collapse">
                               <thead className="bg-slate-50 border-b border-slate-200 text-[12px] font-semibold text-slate-500 whitespace-nowrap">
                                   <tr>
                                       <th className="py-3 px-4 w-[25%]">類別關鍵字 <span className="text-rose-500">*</span></th>
                                       <th className="py-3 px-4 w-[15%]">適用地區</th>
                                       <th className="py-3 px-4 w-[18%]">開始日</th>
                                       <th className="py-3 px-4 w-[18%]">結束日</th>
                                       <th className="py-3 px-4 w-[20%]">備註事由</th>
                                       <th className="py-3 px-4 w-[4%] text-center">操作</th>
                                   </tr>
                               </thead>
                               <tbody className="divide-y divide-slate-100 text-[13px]">
                                   {rules.length === 0 && <tr><td colSpan="6" className="text-center py-8 text-slate-400 text-[13px]">目前無設定任何規則</td></tr>}
                                   {rules.map(r => (
                                       <tr key={r.id} className="hover:bg-slate-50/50 transition-colors">
                                           <td className="p-2.5"><input type="text" value={r.keyword} placeholder="如: KLOOK" onChange={e=>up(r.id,'keyword',e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 outline-none focus:border-blue-500 focus:ring-1" /></td>
                                           <td className="p-2.5"><select value={r.location} onChange={e=>up(r.id,'location',e.target.value)} className="w-full border border-slate-200 rounded-lg px-2 py-2 outline-none focus:border-blue-500 cursor-pointer bg-white h-[38px]"><option value="ALL">不分</option><option value="DOMESTIC">限國內</option><option value="OVERSEAS">限國外</option></select></td>
                                           <td className="p-2.5"><input type="date" value={r.startDate} onChange={e=>up(r.id,'startDate',e.target.value)} className="w-full border border-slate-200 rounded-lg px-2 py-2 outline-none focus:border-blue-500 h-[38px]" /></td>
                                           <td className="p-2.5"><input type="date" value={r.endDate} onChange={e=>up(r.id,'endDate',e.target.value)} className="w-full border border-slate-200 rounded-lg px-2 py-2 outline-none focus:border-blue-500 h-[38px]" /></td>
                                           <td className="p-2.5"><input type="text" value={r.note} placeholder="紀錄..." onChange={e=>up(r.id,'note',e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 outline-none focus:border-blue-500" /></td>
                                           <td className="p-2.5 text-center"><button onClick={()=>del(r.id)} className="text-slate-400 hover:text-rose-500 p-2 hover:bg-rose-50 rounded-lg transition-colors"><i className="fa-solid fa-trash-can"></i></button></td>
                                       </tr>
                                   ))}
                               </tbody>
                           </table>
                       </div>
                   </div>
               </div>
           );
       }

       // --- 主程式 ---
       function App() {
           const [rawData, setRawData] = useState([]);
           const [results, setResults] = useState(null);
           const [activeCardTab, setActiveCardTab] = useState('EVA');
           const [fileName, setFileName] = useState('');
           const [isSettingsOpen, setIsSettingsOpen] = useState(false);
           const [collapsedGroups, setCollapsedGroups] = useState({});
           const [selectedPeriod, setSelectedPeriod] = useState('');
           const [searchTerm, setSearchTerm] = useState('');
           const [unknownOverseasTxs, setUnknownOverseasTxs] = useState([]);
           const [selectedPhysical, setSelectedPhysical] = useState(new Set());
           
           const [settings, setSettings] = useState(() => {
               try {
                   const saved = localStorage.getItem('mileageSettingsV15_cache');
                   if (saved) return { ...DEFAULT_SETTINGS, ...JSON.parse(saved) };
               } catch(e) {}
               return DEFAULT_SETTINGS;
           });

           useEffect(() => {
               localStorage.setItem('mileageSettingsV15_cache', JSON.stringify(settings));
           }, [settings]);

           // 自動載入 GitHub Json
           useEffect(() => {
               if (!localStorage.getItem('mileageSettingsV15_cache')) {
                   fetch('./mileage_settings.json').then(r => r.ok && r.json()).then(data => {
                       if(data) {
                           setSettings(s => ({
                               ...s, ...data,
                               evaBonusRules: parseLegacyKeywords(data.evaBonusRules || data.evaBonusKeywords),
                               amBonusRules: parseLegacyKeywords(data.amBonusRules || data.amBonusKeywords),
                               evaExcludeRules: parseLegacyKeywords(data.evaExcludeRules || data.evaExcludeKeywords),
                               amExcludeRules: parseLegacyKeywords(data.amExcludeRules || data.amExcludeKeywords),
                               evaBaseRules: parseLegacyKeywords(data.evaBaseRules),
                               amBaseRules: parseLegacyKeywords(data.amBaseRules)
                           }));
                       }
                   }).catch(()=>{});
               }
           }, []);

           const exportSettings = () => {
               const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(settings, null, 2));
               const a = document.createElement('a');
               a.href = dataStr;
               a.download = "mileage_settings.json";
               document.body.appendChild(a);
               a.click();
               a.remove();
           };

           const importSettings = (event) => {
               const file = event.target.files[0];
               if (!file) return;
               const reader = new FileReader();
               reader.onload = (e) => {
                   try {
                       const p = JSON.parse(e.target.result);
                       setSettings({ ...DEFAULT_SETTINGS, ...p,
                           evaBonusRules: parseLegacyKeywords(p.evaBonusRules || p.evaBonusKeywords),
                           amBonusRules: parseLegacyKeywords(p.amBonusRules || p.amBonusKeywords),
                           evaExcludeRules: parseLegacyKeywords(p.evaExcludeRules || p.evaExcludeKeywords),
                           amExcludeRules: parseLegacyKeywords(p.amExcludeRules || p.amExcludeKeywords),
                           evaBaseRules: parseLegacyKeywords(p.evaBaseRules),
                           amBaseRules: parseLegacyKeywords(p.amBaseRules)
                       });
                       alert("✅ 設定檔匯入成功！");
                   } catch (error) { alert("❌ 檔案解析失敗，請確認是否為有效的 JSON 設定檔。"); }
               };
               reader.readAsText(file);
               event.target.value = '';
           };

           const handleSettingChange = (e) => {
               const { name, value } = e.target;
               setSettings(prev => ({ ...prev, [name]: name.includes('Rate') || name.includes('Cap') || name === 'billingDay' ? Number(value) : value }));
           };

           const updateRuleList = (listName, newList) => {
               setSettings(prev => ({ ...prev, [listName]: newList }));
           };

           const processFile = (file) => {
               if (!file) return;
               setFileName(file.name);
               const reader = new FileReader();
               reader.onload = (evt) => {
                   try {
                       const wb = XLSX.read(evt.target.result, { type: 'binary' });
                       const ws = wb.Sheets[wb.SheetNames[0]];
                       const rawArray = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                       let hIdx = -1, hMap = {};

                       // 智慧掃描表頭
                       for (let i = 0; i < Math.min(100, rawArray.length); i++) {
                           const rowStr = rawArray[i].join("").replace(/\s/g, "");
                           if ((rowStr.includes("日期") || rowStr.includes("日")) &&
                               (rowStr.includes("明細") || rowStr.includes("說明") || rowStr.includes("店家") || rowStr.includes("摘要"))) {
                               hIdx = i;
                               rawArray[i].forEach((col, idx) => {
                                   const n = String(col).trim();
                                   if (/日期|消費日|交易日/i.test(n)) hMap["date"] = idx;
                                   else if (/說明|明細|店家|摘要|商店/i.test(n)) hMap["desc"] = idx;
                                   else if (/(金額|TWD|台幣)/i.test(n) && !/外幣/.test(n)) hMap["amt"] = idx;
                                   else if (/卡號/.test(n) && !/行動/.test(n)) hMap["card"] = idx;
                                   else if (/國家|國別/.test(n)) hMap["ctry"] = idx;
                                   else if (/起息日|入帳/.test(n)) hMap["post"] = idx;
                               });
                               break;
                           }
                       }

                       if (hIdx === -1 || hMap["amt"] === undefined) throw new Error("找不到正確的明細標題列");

                       const clean = [];
                       for (let i = hIdx + 1; i < rawArray.length; i++) {
                           const row = rawArray[i];
                           const d = row[hMap.date], a = row[hMap.amt];
                           if (!d || a === undefined || a === "") continue;

                           let aStr = String(a).replace(/TWD|USD|,|\s/gi, '').replace(/−/g, '-');
                           if (aStr === '-' || aStr === '') continue;

                           let ctry = String(row[hMap.ctry] || 'TW').trim().replace(/−/g, 'TW');

                           clean.push({
                               date: d,
                               desc: String(row[hMap.desc] || '').trim(),
                               amt: aStr,
                               card: String(row[hMap.card] || '').replace(/["'=]/g, '').trim(),
                               ctry: ctry,
                               post: row[hMap.post] || d
                           });
                       }
                       setRawData(clean);
                   } catch (e) {
                       alert("解析失敗: " + e.message);
                   }
               };
               reader.readAsBinaryString(file);
           };

           const normalizeDate = (val) => {
               if (!val) return '未知';
               let s = String(val).trim();
               if (!isNaN(s) && Number(s) > 40000) {
                   const d = new Date((Number(s) - 25569) * 86400 * 1000);
                   return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
               }
               s = s.replace(/-/g, '/');
               if (/^\d{1,2}\/\d{1,2}$/.test(s)) {
                   let y = new Date().getFullYear();
                   s = `${y}/${s}`;
               }
               const p = s.split('/');
               if (p.length >= 3) return `${p[0].length===2?'20'+p[0]:p[0]}/${p[1].padStart(2,'0')}/${p[2].substring(0,2).padStart(2,'0')}`;
               return s.substring(0, 10);
           };

           const getPeriod = (postDate, billingDay) => {
               const d = new Date(postDate);
               if (isNaN(d.getTime())) return '未明帳單期';
               let y = d.getFullYear(), m = d.getMonth() + 1;
               if (d.getDate() > billingDay) {
                   m++; if (m > 12) { m = 1; y++; }
               }
               return `${y}/${String(m).padStart(2, '0')} 帳單`;
           };

           const calculate = (data, sett) => {
               const evaC = sett.evaCards.split(',').map(s => s.trim()).filter(Boolean);
               const amC = sett.amCards.split(',').map(s => s.trim()).filter(Boolean);
               const evaRes = { periods: {} }, amRes = { periods: {} }, unknowns = new Set();

               data.forEach(row => {
                   const amount = parseFloat(row.amt);
                   if (isNaN(amount)) return;
                   const txD = normalizeDate(row.date), postD = normalizeDate(row.post);
                   const isO = row.ctry !== 'TW' && row.ctry !== '';
                   const bp = getPeriod(postD, sett.billingDay);
                   const desc = row.desc;

                   const matchRule = (rules) => {
                       let best = null;
                       const txT = new Date(txD).getTime();
                       for (const r of rules) {
                           if (r.keyword && desc.includes(r.keyword)) {
                               let ok = true;
                               if (r.startDate && txT < new Date(r.startDate.replace(/-/g,'/')).getTime()) ok = false;
                               if (r.endDate && txT > new Date(r.endDate.replace(/-/g,'/')).getTime() + 86400000) ok = false;
                               if (r.location === 'DOMESTIC' && isO) ok = false;
                               if (r.location === 'OVERSEAS' && !isO) ok = false;
                               if (ok && (!best || r.keyword.length > best.keyword.length)) best = r;
                           }
                       }
                       return best;
                   };

                   const isEva = evaC.some(c => row.card.includes(c));
                   const isAm = amC.some(c => row.card.includes(c));

                   if (isEva) {
                       const mB = matchRule(sett.evaBonusRules), mE = matchRule(sett.evaExcludeRules), mBase = matchRule(sett.evaBaseRules);
                       let mode = 'BASE', rule = null;
                       if (mBase) { mode = 'BASE_EX'; rule = mBase; }
                       if (mE && (!rule || mE.keyword.length > rule.keyword.length)) { mode = 'EXCLUDE'; rule = mE; }
                       if (mB && (!rule || mB.keyword.length > rule.keyword.length)) { mode = 'BONUS'; rule = mB; }

                       let isExc = mode === 'EXCLUDE', isBon = mode === 'BONUS', isBex = mode === 'BASE_EX';
                       let rate = sett.evaBaseRate;

                       if (!isExc) {
                           if (isO && !isBon && !isBex) {
                               if (sett.evaOverseasPhysical?.includes(desc)) { isBon = true; rate = sett.evaOverseasRate; rule = {keyword:'海外實體店', note:'長榮海外實體交易自動加碼'}; }
                               else if (sett.evaOverseasOnline?.includes(desc)) { rate = sett.evaOverseasRate; }
                               else unknowns.add(desc);
                           } else if (isO || isBon) rate = sett.evaOverseasRate;
                       }

                       const b = isExc ? 0 : Math.ceil(amount / rate), t = isBon ? Math.ceil(amount / sett.evaBonusRate) : b;
                       if (!evaRes.periods[bp]) evaRes.periods[bp] = { days: {}, baseM: 0, bonusM: 0, validA: 0 };
                       if (!evaRes.periods[bp].days[postD]) evaRes.periods[bp].days[postD] = { txs: [], sumA: 0, baseM: 0, bonusM: 0 };
                       const dO = evaRes.periods[bp].days[postD];
                       dO.txs.push({ txD, desc, amt: amount, card: row.card, ctry: row.ctry, isExc, isBon, isBex, rule, base: b, bonus: t - b, isO });
                       if (!isExc) { dO.sumA += amount; dO.baseM += b; dO.bonusM += (t - b); evaRes.periods[bp].baseM += b; evaRes.periods[bp].bonusM += (t - b); evaRes.periods[bp].validA += amount; }
                   } else if (isAm) {
                       const mB = matchRule(sett.amBonusRules), mE = matchRule(sett.amExcludeRules), mBase = matchRule(sett.amBaseRules);
                       let mode = 'BASE', rule = null;
                       if (mBase) { mode = 'BASE_EX'; rule = mBase; }
                       if (mE && (!rule || mE.keyword.length > rule.keyword.length)) { mode = 'EXCLUDE'; rule = mE; }
                       if (mB && (!rule || mB.keyword.length > rule.keyword.length)) { mode = 'BONUS'; rule = mB; }

                       const isExc = mode === 'EXCLUDE', isBex = mode === 'BASE_EX' && !isO;
                       let isBon = false;
                       
                       if (!isExc && !isBex) {
                           isBon = isO || mode === 'BONUS';
                           if (isBon && isO && !rule) rule = { keyword: '海外消費', note: '亞洲萬里通海外自動列為加碼' };
                       }

                       if (!amRes.periods[bp]) amRes.periods[bp] = { days: {}, usedB: 0, baseM: 0, bonusM: 0, validA: 0 };
                       if (!amRes.periods[bp].days[postD]) amRes.periods[bp].days[postD] = { txs: [], totalA: 0, totalB: 0 };

                   }

                               d.bonusM = Math.max(0, max加碼 - p.bonusM); p.usedB = sett.amMonthlyCap;
                           } else {
                               d.bonusM = Math.ceil(canB/sett.amBonusRate) - Math.ceil(canB/sett.amBaseRate); p.usedB += canB;
                           }
                       } else d.bonusM = 0;
                       p.baseM += d.baseM; p.bonusM += d.bonusM; d.totalM = d.baseM + d.bonusM;
                   });

               setResults({ eva: evaRes, am: amRes });

                   <main className="flex-1 overflow-y-auto custom-scrollbar relative bg-slate-50">
                       {rawData.length === 0 ? (
                           <div className="h-full flex flex-col items-center justify-center p-6"><div className="w-20 h-20 bg-blue-50 text-blue-500 rounded-3xl flex items-center justify-center mb-6 text-3xl shadow-inner border border-blue-100"><i className="fa-solid fa-file-invoice"></i></div><h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-2">匯入您的消費紀錄</h2><p className="text-slate-400 text-[13px] md:text-sm mb-8 text-center max-w-sm leading-relaxed">請上傳銀行 CSV/XLSX 檔案，V15 解析引擎將為您自動清除裝飾字元並試算回饋。</p><label className="bg-blue-600 hover:bg-blue-700 text-white px-8 md:px-10 py-3.5 rounded-2xl font-bold shadow-xl shadow-blue-500/20 active:scale-95 cursor-pointer transition-all flex items-center gap-2"><input type="file" accept=".csv,.xlsx" onChange={e=>processFile(e.target.files[0])} className="hidden"/><i className="fa-solid fa-cloud-arrow-up"></i>選擇檔案開始試算</label></div>

                               <div className="flex flex-col md:flex-row justify-between items-stretch md:items-end mb-6 gap-4">

                                           const key = `${activeCardTab}-${selectedPeriod}-${day}`, isC = collapsedGroups[key], isEVA = activeCardTab==='EVA';
                                           const filtered = dO.txs.filter(t=>searchTerm===''||t.desc.toLowerCase().includes(searchTerm.toLowerCase()));
                                           if (searchTerm!=='' && filtered.length===0) return null;
                                           return (
                                               <React.Fragment key={day}>
                                                   <tr onClick={()=>toggleGroup(key)} className={`border-y border-slate-100 cursor-pointer transition-colors ${isEVA?'bg-emerald-50/30 hover:bg-emerald-50/60':'bg-teal-50/30 hover:bg-teal-50/60'}`}><td className="py-3.5 px-6 md:px-8 font-bold bg-white border-r border-slate-100"><div className="flex items-center gap-2 md:gap-3"><i className={`fa-solid fa-chevron-down text-[10px] text-slate-300 transition-transform ${isC?'-rotate-90':''}`}></i><span className="text-[10px] text-slate-400 font-bold uppercase tracking-tighter shrink-0 hidden md:inline">結算日</span>{day.substring(5)}</div></td><td className="py-3.5 px-4 text-slate-500 font-bold text-[11px] md:text-[12px]">{isEVA?`日總額 $${dO.sumA.toLocaleString()}`:<><span className="mr-2">日認列 $${dO.totalA.toLocaleString()}</span><span className="text-slate-300 mr-2">|</span><span className="text-teal-600 bg-white px-1.5 py-0.5 rounded shadow-sm border border-teal-100">加碼池 $${dO.totalB.toLocaleString()}</span></>}</td><td className="text-right text-slate-300 px-4 md:px-6">-</td><td className="text-right font-bold text-slate-800 px-4 md:px-6">{isEVA?dO.baseM:dO.baseM}</td><td className={`text-right font-bold px-6 md:px-8 ${isEVA?'text-emerald-600':'text-teal-600'}`}>{dO.bonusM>0?'+':''}{dO.bonusM}</td></tr>
                                                   {!isC && filtered.sort((a,b)=>new Date(a.txD)-new Date(b.txD)).map((t,idx)=>(
                                                       <tr key={idx} className={`bg-white border-b border-slate-50 last:border-0 table-row-hover ${t.isExc?'opacity-40 grayscale':''}`}><td className="py-3 px-6 md:px-8 text-slate-400 whitespace-nowrap pl-10 md:pl-14"><span className="text-[9px] font-bold mr-1.5 opacity-50 uppercase tracking-tighter">消費日</span>{t.txD.substring(5)}</td>
                                                       <td className="py-3 px-4"><div className="flex flex-col md:flex-row md:items-center gap-1.5"><span className={`font-medium max-w-[180px] md:max-w-xs truncate ${t.isExc?'line-through':''}`}>{searchTerm!==''?<span className="text-blue-600">{t.desc}</span>:t.desc}</span><div className="flex flex-wrap gap-1 items-center shrink-0"><span className="text-[9px] text-slate-400 font-mono bg-slate-100 px-1.5 py-0.5 rounded shadow-sm">{t.card}</span>{t.isO && <span className="text-[9px] font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100">海外</span>}{t.isExc && <><span className="text-[9px] font-bold text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded border border-rose-100">排除</span><InfoTooltip rule={t.rule} theme="rose"/></>}{t.isBex && <><span className="text-[9px] font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100">強制一般</span><InfoTooltip rule={t.rule} theme="blue"/></>}{t.isBon && !t.isExc && !t.isBex && <><span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border shadow-sm ${isEVA?'text-emerald-600 bg-emerald-50 border-emerald-100':'text-teal-600 bg-teal-50 border-teal-100'}`}>加碼</span><InfoTooltip rule={t.rule} theme={isEVA?'emerald':'teal'}/></>}</div></div></td>
                                                       <td className={`py-3 px-4 md:px-6 text-right font-medium ${t.amt<0?'text-rose-500':'text-slate-600'}`}>{t.amt.toLocaleString()}</td>
                                                       {isEVA?(<><td className="py-3 px-4 md:px-6 text-right font-bold text-slate-600">{t.base}</td><td className="py-3 px-6 md:px-8 text-right font-bold text-emerald-600">{t.bonus>0?`+${t.bonus}`:t.bonus===0?'-':t.bonus}</td></>):(<td colSpan="2" className="py-3 px-6 md:px-8 text-right text-slate-300 italic text-[11px]"></td>)}</tr>
                                                   ))}
                                               </React.Fragment>
                                           )})}</tbody></table></div>
                               </div>
                           </div>
                       )}
                   </main>
               </div>
           );
       }

       const root = ReactDOM.createRoot(document.getElementById('root'));
       root.render(<App />);
   </script>
</body>
</html>
